# Chrono layout mapped and write-back verified on 2026-10-21 via reset of each block.
# Mapping confirmed by the user at the Task 4 checkpoint (2026-10-22).
# Bytes that always read 1 are deliberately absent.

[chrono]
time_unit_min = 10
unset_value = 144
day_mask_bits = "mon=0,tue=1,wed=2,thu=3,fri=4,sat=5,sun=6"

